name: FIFO integration
on:
  push:
    branches: [feat/fifo-snapcast]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test && npm run validate:source && npm run build && npm run validate
      - name: Install audio processes
        run: |
          sudo apt-get update
          sudo apt-get install -y mpd mpc snapserver snapclient ffmpeg
          sudo systemctl stop mpd.socket mpd snapserver snapclient || true
      - run: python3 tests/integration/fifo-snapcast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fifo-linux-evidence
          path: |
            _build/fifo-integration/
            dist/*.jsplugin.zip
          retention-days: 7
