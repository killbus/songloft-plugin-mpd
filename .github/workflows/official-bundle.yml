name: Official Songloft bundle acceptance
on:
  push:
    branches: [test/official-mpd-bundle]
  pull_request:
    paths:
      - 'tests/integration/**'
      - '.github/workflows/official-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x86_64-musl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test && npm run validate:source
      - name: Install test-side audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y snapserver snapclient ffmpeg
          sudo systemctl stop snapserver snapclient || true
      - name: Download candidate (SHA256 checked by test)
        run: |
          curl --fail --location --retry 3 --output /tmp/mpd-bundle.tgz \
            https://github.com/huaimi123/mympd/releases/download/v1.0.1/mpd-player-linux-x86_64-musl.tgz
      - name: Test bundle in unmodified official image
        run: python3 tests/integration/official-bundle.py /tmp/mpd-bundle.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-songloft-bundle-evidence
          path: |
            _build/fifo-integration/*.json
            _build/fifo-integration/*.log
            _build/fifo-integration/*.conf
          retention-days: 14
